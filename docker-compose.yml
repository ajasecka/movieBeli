services:
  db:
    image: postgres:16-alpine
    container_name: moviebeli-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: moviebeli
      POSTGRES_PASSWORD: moviebeli
      POSTGRES_DB: moviebeli
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U moviebeli"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
